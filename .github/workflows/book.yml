name: Book

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install
      - run: |
          sudo apt-get update
          sudo apt-get install -y pandoc latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: book-pdf
          path: dist/book.pdf
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          name: book-latex-source
          path: dist/book-latex-source.tar.gz
