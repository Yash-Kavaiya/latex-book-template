name: Build book

# Any push or pull request that touches notes/**/*.md (or anything else
# that can change the rendered output) re-runs the full build. Editing
# only notes/**/*.md and book.yml is all authors ever need to do.
on:
  push:
    paths: &book_paths
      - "notes/**"
      - "book.yml"
      - "schema/**"
      - "templates/**"
      - "filters/**"
      - "scripts/**"
      - "tests/**"
      - "Dockerfile"
      - "requirements*.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-book.yml"
  pull_request:
    paths: *book_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate content and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate notes/ and book.yml
        run: |
          python scripts/validate.py
          python scripts/build.py --validate-only

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build:
    name: Render and package
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm

      - run: pip install -r requirements.txt

      - name: Install build dependencies in pinned runner environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # ubuntu-24.04 pins the distribution used by these packages instead
          # of inheriting the moving ubuntu-latest environment. Chromium
          # ships preinstalled on this runner image, so it is not apt-get
          # installed here; see the next step.
          sudo apt-get install --no-install-recommends -y \
            latexmk \
            librsvg2-bin \
            pandoc \
            fonts-texgyre \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-xetex \
            zip

      - name: Locate the runner's preinstalled Chromium/Chrome
        run: |
          browser="$(command -v chromium-browser || command -v chromium || command -v google-chrome || true)"
          test -n "$browser" || { echo "no Chromium/Chrome executable found on this runner" >&2; exit 1; }
          echo "PUPPETEER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"

      - name: Install Mermaid CLI
        env:
          # mermaid-cli's Puppeteer drives the preinstalled browser above
          # instead of downloading its own copy.
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
        run: npm ci

      - name: Build book
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          bash scripts/build-book.sh 2>&1 | tee logs/build-book.log

      - name: Verify build output content
        run: python scripts/verify-build.py

      - name: Package reproducible LaTeX source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # book.tex references images as build/assets/..., so the zip keeps
          # that same relative layout: extracting it and running latexmk
          # from the extraction root reproduces the PDF with zero path
          # rewriting and no dependency on this repository, Pandoc, Node, or
          # Python.
          zip -q -r dist/latex-source.zip build/book.tex build/assets
          test -s dist/latex-source.zip

      - name: Upload rendered PDF
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: book-pdf
          path: build/book.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload reproducible LaTeX source
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: latex-source
          path: dist/latex-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiler logs after failure
        if: ${{ failure() }}
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: book-build-logs
          path: |
            logs/build-book.log
            build/**/*.log
          if-no-files-found: warn
          retention-days: 14
